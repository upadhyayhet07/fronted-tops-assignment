<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Grid Layout</title>
  <style>
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      margin: 8px;
      transition: background 0.2s;
    }
    .primary {
      background: #007bff;
      color: #fff;
    }
    .primary:hover {
      background: #0056b3;
    }
    .secondary {
      background: #e0e0e0;
      color: #222;
    }
    .secondary:hover {
      background: #c0c0c0;
    }
    .danger {
      background: #dc3545;
      color: #fff;
    }
    .danger:hover {
      background: #a71d2a;
    }
  </style>
</head>
<body>
  <button class="btn primary">Primary</button>
  <button class="btn secondary">Secondary</button>
  <button class="btn danger">Danger</button>
</body>
</html>
