<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Pseudo-Classes and Pseudo-Elements</title>

  <style>
    /* Style links with pseudo-classes */
    a:link {
      color: blue;
      text-decoration: none;
    }

    a:visited {
      color: purple;
    }

    a:hover {
      color: red;
      text-decoration: underline;
    }

    a:active {
      color: green;
    }

    /* Style only the first line of the paragraph */
    p::first-line {
      font-weight: bold;
      color: darkorange;
      font-size: 1.2em;
    }

    /* Add decorative ::before element to heading */
    h1::before {
      content: "★ ";
      color: gold;
      font-size: 1.5em;
    }
  </style>
</head>
<body>

  <h1>My Favorite Websites</h1>

  <p>
    Welcome to my webpage! Here are some of my favorite websites. 
    Feel free to explore them and see what interests you.
  </p>

  <ul>
    <li><a href="https://www.google.com">Google</a></li>
    <li><a href="https://www.wikipedia.org">Wikipedia</a></li>
    <li><a href="https://www.github.com">GitHub</a></li>
  </ul>

</body>
</html>
