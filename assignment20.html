<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tailwind Custom Login Page</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom Tailwind Config (inline) -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              light: '#93c5fd',   // light blue
              DEFAULT: '#2563eb', // main brand color
              dark: '#1e40af',    // deep navy blue
            },
            accent: '#f59e0b',     // orange accent
          },
          spacing: {
            '18': '4.5rem',        // new custom spacing
            '84': '21rem',         // large spacing for layout
          },
          borderRadius: {
            'xl2': '1.25rem',
          },
        },
      },
    };
  </script>
</head>

<body class="bg-gradient-to-br from-brand-light via-white to-brand-light/30 min-h-screen flex items-center justify-center">

  <!-- Card (Custom component) -->
  <div class="bg-white shadow-2xl rounded-xl2 w-full max-w-md p-8 sm:p-10 mx-4">
    <h1 class="text-3xl font-bold text-brand text-center mb-6">Welcome Back</h1>
    <p class="text-gray-500 text-center mb-8">Please log in to continue</p>

    <!-- Login Form -->
    <form class="space-y-5">
      <div>
        <label for="email" class="block text-gray-700 font-medium mb-2">Email address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" 
               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand focus:border-brand" required>
      </div>

      <div>
        <label for="password" class="block text-gray-700 font-medium mb-2">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" 
               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand focus:border-brand" required>
      </div>

      <div class="flex items-center justify-between">
        <label class="flex items-center text-sm text-gray-600">
          <input type="checkbox" class="mr-2 accent-brand" />
          Remember me
        </label>
        <a href="#" class="text-sm text-brand hover:text-brand-dark">Forgot password?</a>
      </div>

      <!-- Custom Button -->
      <button type="submit" 
              class="w-full py-3 mt-4 bg-brand text-white font-semibold rounded-lg hover:bg-brand-dark transition transform hover:scale-[1.02] shadow-md">
        Log In
      </button>
    </form>

    <!-- Divider -->
    <div class="flex items-center my-6">
      <div class="flex-grow h-px bg-gray-300"></div>
      <span class="px-3 text-gray-400 text-sm">or</span>
      <div class="flex-grow h-px bg-gray-300"></div>
    </div>

    <!-- Custom secondary button -->
    <button class="w-full py-3 bg-accent text-white font-semibold rounded-lg hover:bg-orange-600 transition transform hover:scale-[1.02]">
      Create an Account
    </button>

    <!-- Footer text -->
    <p class="text-center text-gray-500 text-sm mt-6">
      By logging in, you agree to our 
      <a href="#" class="text-brand hover:text-brand-dark">Terms</a> and 
      <a href="#" class="text-brand hover:text-brand-dark">Privacy Policy</a>.
    </p>
  </div>

</body>
</html>
