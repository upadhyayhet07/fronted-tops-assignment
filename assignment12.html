<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Creating Animations</title>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #eee;
  }

  .box {
    width: 100px;
    height: 100px;
    background-color: blue;
    position: relative;
    animation: moveBox 4s infinite alternate;
  }

  @keyframes moveBox {
    0% { left: 0; background-color: blue; }
    50% { left: 200px; background-color: red; }
    100% { left: 0; background-color: green; }
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
