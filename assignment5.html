<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Flexbox Layout</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
    }

    header, footer {
      background-color: #333;
      color: white;
      text-align: center;
      padding: 20px;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      background-color: #fff;
      padding: 20px;
      gap: 20px;
    }

    .box {
      background-color: #4CAF50;
      color: white;
      padding: 40px;
      border-radius: 8px;
      width: 80%;
      text-align: center;
    }

    @media (min-width: 768px) {
      main {
        flex-direction: row;
      }
      .box {
        width: 25%;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>My Flexbox Layout</h1>
  </header>

  <main>
    <div class="box">Content Box 1</div>
    <div class="box">Content Box 2</div>
    <div class="box">Content Box 3</div>
  </main>

  <footer>
    <p>&copy; 2025 Flexbox Assignment</p>
  </footer>
</body>
</html>
