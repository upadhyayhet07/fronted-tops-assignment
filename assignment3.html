<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Working with Borders and Shadows</title>

  <style>
    body {
      background-color: #f2f2f2;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background-color: white;
      width: 300px;
      padding: 20px;
      border: 2px solid #007bff;
      border-radius: 15px; 
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3); 
      text-align: center;
    }

    h2 {
      color: #007bff;
    }

    p {
      color: #333;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>My CSS Card</h2>
    <p>This card uses borders, rounded corners, and a box shadow to create a modern design effect.</p>
  </div>

</body>
</html>
