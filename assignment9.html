<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Form</title>
  <style>
    body {
      background: #f4f4f4;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .contact-form {
      background: #fff;
      padding: 32px 28px;
      border-radius: 12px;
      box-shadow: 0 2px 24px rgba(0,0,0,0.09);
      width: 320px;
      margin: auto;
    }
    .contact-form h2 {
      text-align: center;
      margin-bottom: 18px;
      color: #333;
    }
    .contact-form label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #333;
    }
    .contact-form input,
    .contact-form textarea {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 16px;
      border: 2px solid #eee;
      border-radius: 7px;
      background: #fafafa;
      font-size: 1rem;
      transition: border 0.25s;
      outline: none;
      resize: none;
    }
    .contact-form input:focus,
    .contact-form textarea:focus {
      border: 2px solid #665df7;
      background-color: #f0f3ff;
    }
    .contact-form button {
      background: #665df7;
      color: #fff;
      font-weight: bold;
      border: none;
      padding: 12px 0;
      width: 100%;
      border-radius: 7px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s;
    }
    .contact-form button:hover {
      background: #4a41b9;
    }
  </style>
</head>
<body>
  <form class="contact-form">
    <h2>Contact Us</h2>
    <label for="name">Name</label>
    <input type="text" id="name" name="name" required />

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required />

    <label for="message">Message</label>
    <textarea id="message" name="message" rows="4" required></textarea>

    <button type="submit">Submit</button>
  </form>
</body>
</html>
