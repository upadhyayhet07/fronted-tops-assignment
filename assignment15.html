<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> CSS Transitions, Transforms & Navigation</title>
  <style>
    
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      background-color: #f5f5f5;
      color: #333;
    }

    header {
      background: linear-gradient(90deg, #4CAF50, #2196F3);
      color: white;
      text-align: center;
      padding: 20px 0;
    }

    header h1 {
      margin: 0;
      font-size: 2rem;
    }

    
    nav {
      background-color: #333;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
    }

    nav a {
      color: white;
      text-decoration: none;
      padding: 14px 20px;
      display: block;
      transition: background 0.3s;
    }

    nav a:hover {
      background-color: #4CAF50;
    }

    
    .side-nav {
      background-color: #222;
      width: 180px;
      position: fixed;
      top: 100px;
      left: 0;
      height: auto;
      padding-top: 10px;
    }

    .side-nav a {
      display: block;
      color: white;
      text-decoration: none;
      padding: 10px 15px;
      border-bottom: 1px solid #444;
      transition: background 0.3s;
    }

    .side-nav a:hover {
      background-color: #4CAF50;
    }


    .gallery-section {
      margin-left: 200px;
      padding: 40px 20px;
      text-align: center;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
    }

    .image {
      width: 250px;
      height: 180px;
      overflow: hidden;
      border-radius: 10px;
      background: white;
      border: 3px solid #ddd;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      transition: transform 0.5s ease, box-shadow 0.5s ease, border-color 0.5s;
    }

    .image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }


    .image:hover {
      transform: scale(1.08) rotate(2deg);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
      border-color: #4CAF50;
    }

    .image:hover img {
      transform: scale(1.1);
    }

    
    footer {
      text-align: center;
      background-color: #222;
      color: white;
      padding: 15px;
      margin-top: 50px;
    }

    
    @media (max-width: 768px) {
      .gallery-section {
        margin-left: 0;
      }
      .side-nav {
        display: none;
      }
    }
  </style>
</head>
<body>

  
  <header>
    <h1>My Interactive Image Gallery</h1>
    <p>Using CSS transitions, transforms, and navigation menus</p>
  </header>

  
  <nav>
    <a href="#home">Home</a>
    <a href="#gallery">Gallery</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
  </nav>

  
  <div class="side-nav">
    <a href="#link1">Nature</a>
    <a href="#link2">Cities</a>
    <a href="#link3">People</a>
    <a href="#link4">Animals</a>
  </div>

  
  <section id="gallery" class="gallery-section">
    <h2>Explore Beautiful Images</h2>
    <p>Hover over each image to see CSS transition and transform effects in action.</p>

    <div class="gallery">
      <div class="image"><img src="c:\images\beautiful1.jpeg" alt="Image 1"></div>
      <div class="image"><img src="c:\images\beautiful2.jpeg" alt="Image 2"></div>
      <div class="image"><img src="c:\images\beautiful3.jpeg" alt="Image 3"></div>
      <div class="image"><img src="c:\images\beautiful4.jpeg" alt="Image 4"></div>
      <div class="image"><img src="c:\images\beautiful5.jpeg" alt="Image 5"></div>
      <div class="image"><img src="c:\images\beautiful6.jpeg" alt="Image 6"></div>
      
    </div>
  </section>

  
  <footer>
    © 2025 My Gallery. All Rights Reserved.
  </footer>

</body>
</html>
