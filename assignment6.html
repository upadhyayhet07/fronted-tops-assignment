<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Grid Layout</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
    }

    header, footer {
      background-color: #333;
      color: white;
      text-align: center;
      padding: 20px;
    }

    main {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      padding: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .image-box {
      background-color: #4CAF50;
      color: white;
      padding: 40px 0;
      text-align: center;
      border-radius: 8px;
      font-size: 1.2rem;
    }

    @media (max-width: 800px) {
      main {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 500px) {
      main {
        grid-template-columns: 1fr;
      }
    }

    footer {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <header>
    <h1>My Grid Gallery</h1>
  </header>

  <main>
    <div class="image-box">Image 1</div>
    <div class="image-box">Image 2</div>
    <div class="image-box">Image 3</div>
    <div class="image-box">Image 4</div>
    <div class="image-box">Image 5</div>
    <div class="image-box">Image 6</div>
  </main>

  <footer>
    <p>&copy; 2025 Grid Layout Assignment</p>
  </footer>
</body>
</html>
