<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Text Styling</title>

  <style>
  h1 {
      font-size: 24px;
      text-align: center;
      color: navy;
    }

    p {
      font-family: Arial, sans-serif;
      color: navy;
      text-align: justify;
      margin: 20px;
    }
  </style>
</head>
<body>
  <h1>Welcome to My Styled Page</h1>
  <p>
    CSS (Cascading Style Sheets) helps you style and design web pages. 
    You can change colors, fonts, spacing, and layout to make your website 
    more attractive and easy to read.
  </p>
</body>
</html>
